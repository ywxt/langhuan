_version: 2
error.javascript:
  en: "JavaScript feed error: %{error}"
  zh: "JavaScript 書源錯誤：%{error}"
  zh-CN: "JavaScript 书源错误：%{error}"
error.http:
  en: "HTTP request failed: %{error}"
  zh: "網絡請求失敗：%{error}"
  zh-CN: "网络请求失败：%{error}"
error.missing_function:
  en: "Missing required function: %{name}"
  zh: "缺少必要函數：%{name}"
  zh-CN: "缺少必要函数：%{name}"
error.invalid_feed:
  en: "Invalid feed metadata: %{message}"
  zh: "書源元數據無效：%{message}"
  zh-CN: "书源元数据无效：%{message}"
error.script_parse:
  en: "Script parse error at line %{line}: %{message}"
  zh: "腳本解析錯誤（第 %{line} 行）：%{message}"
  zh-CN: "脚本解析错误（第 %{line} 行）：%{message}"
error.feed_not_found:
  en: "Feed not found: %{id}"
  zh: "找不到書源：%{id}"
  zh-CN: "找不到书源：%{id}"
error.database:
  en: "Database error: %{message}"
  zh: "資料庫錯誤：%{message}"
  zh-CN: "资料库错误：%{message}"
error.feed_script_missing:
  en: "Feed '%{id}': no script stored for its active version"
  zh: "書源「%{id}」：未存儲當前版本的腳本"
  zh-CN: "书源「%{id}」：未存储当前版本的脚本"
error.domain_not_allowed:
  en: "Domain not allowed: %{host} (allowed: %{allowed})"
  zh: "域名未授權：%{host}（允許：%{allowed}）"
  zh-CN: "域名未授权：%{host}（允许：%{allowed}）"
error.none:
  en: "none"
  zh: "無"
  zh-CN: "无"
error.feed_schema_too_new:
  en: "Feed '%{feed_id}' requires schema version %{file_version}, but only version %{supported_version} is supported. Please update the app."
  zh: "書源「%{feed_id}」需要架構版本 %{file_version}，但僅支持版本 %{supported_version}，請更新應用。"
  zh-CN: "书源「%{feed_id}」需要架构版本 %{file_version}，但仅支持版本 %{supported_version}，请更新应用。"
error.auth_status_not_supported:
  en: "Feed '%{feed_id}' does not support auth status check."
  zh: "書源「%{feed_id}」不支持登錄狀態檢查。"
  zh-CN: "书源「%{feed_id}」不支持登录状态检查。"
error.auth_verification_failed:
  en: "Login could not be verified. Please finish signing in and try again."
  zh: "無法驗證登錄狀態，請完成登錄後重試。"
  zh-CN: "无法验证登录状态，请完成登录后重试。"
error.duplicate_id:
  en: "Feed '%{feed_id}': duplicate %{kind} id '%{id}'"
  zh: "書源「%{feed_id}」：重複的%{kind} ID「%{id}」"
  zh-CN: "书源「%{feed_id}」：重复的%{kind} ID「%{id}」"
error.file_read:
  en: "Failed to read file: %{error}"
  zh: "無法讀取文件：%{error}"
  zh-CN: "无法读取文件：%{error}"
error.script_too_large:
  en: "Feed script exceeds the %{limit} size limit"
  zh: "書源腳本超過 %{limit} 大小上限"
  zh-CN: "书源脚本超过 %{limit} 大小上限"
error.response_too_large:
  en: "HTTP response exceeds the %{limit} size limit"
  zh: "HTTP 回應超過 %{limit} 大小上限"
  zh-CN: "HTTP 回应超过 %{limit} 大小上限"
error.no_pending_preview:
  en: "No pending preview for this request"
  zh: "找不到對應的預覽記錄"
  zh-CN: "找不到对应的预览记录"
error.app_data_dir_not_set:
  en: "App data directory not set"
  zh: "應用數據目錄尚未設置"
  zh-CN: "应用数据目录尚未设置"
error.bookshelf_unavailable:
  en: "Bookshelf is unavailable"
  zh: "書架當前不可用"
  zh-CN: "书架当前不可用"
error.feed_unavailable:
  en: "Feed '%{id}' not found or failed to load"
  zh: "找不到書源「%{id}」或其加載失敗"
  zh-CN: "找不到书源「%{id}」或其加载失败"
error.app_data_reload_not_supported:
  en: "App data reload is not supported at runtime"
  zh: "運行時不支持重新加載應用數據"
  zh-CN: "运行时不支持重新加载应用数据"
error.expected.auth_required:
  en: "Login required: %{message}"
  zh: "需要登錄：%{message}"
  zh-CN: "需要登录：%{message}"
error.expected.cf_challenge:
  en: "Cloudflare challenge detected: %{message}"
  zh: "觸發了 Cloudflare 驗證：%{message}"
  zh-CN: "触发了 Cloudflare 验证：%{message}"
error.expected.rate_limited:
  en: "Rate limited: %{message}"
  zh: "請求過於頻繁：%{message}"
  zh-CN: "请求过于频繁：%{message}"
error.expected.content_not_found:
  en: "Content not found: %{message}"
  zh: "找不到內容：%{message}"
  zh-CN: "找不到内容：%{message}"
error.expected.source_unavailable:
  en: "Source unavailable: %{message}"
  zh: "書源暫時不可用：%{message}"
  zh-CN: "书源暂时不可用：%{message}"
error.expected.unknown:
  en: "Script error [%{code}]: %{message}"
  zh: "腳本錯誤 [%{code}]：%{message}"
  zh-CN: "脚本错误 [%{code}]：%{message}"
error.export_serialization_failed:
  en: "Feed export serialization failed: %{error}"
  zh: "書源導出序列化失敗：%{error}"
  zh-CN: "书源导出序列化失败：%{error}"
error.not_a_feed_export:
  en: "Not a feed export: %{error}"
  zh: "不是書源導出文件：%{error}"
  zh-CN: "不是书源导出文件：%{error}"
error.unknown_export_format:
  en: "Unknown feed export format: expected langhuan-feeds"
  zh: "未知的書源導出格式：應為 langhuan-feeds"
  zh-CN: "未知的书源导出格式：应为 langhuan-feeds"
error.malformed_feed_export:
  en: "Malformed feed export: %{error}"
  zh: "書源導出文件格式錯誤：%{error}"
  zh-CN: "书源导出文件格式错误：%{error}"
error.empty_feed_export:
  en: "Feed export contains no feeds"
  zh: "書源導出文件不含任何書源"
  zh-CN: "书源导出文件不含任何书源"
