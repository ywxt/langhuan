[package]
name = "langhuan"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[lints.clippy]
wildcard_imports = "deny"

[dependencies]
rquickjs = { version = "0.14", features = ["bindgen", "parallel"] }
reqwest = { version = "0.13", features = [
    "query",
    "gzip",
    "deflate",
    "brotli",
    # `stream` enables `Response::bytes_stream`, used for size-capped cover
    # downloads.
    "stream",
] }
# TLS: rustls configured with the bundled Mozilla root set — see
# `http::new_client` for why the platform verifier is not used.
rustls = "0.23"
webpki-roots = "1"
bytes = "1"
# WHATWG encoding registry (TextDecoder/TextEncoder for feed scripts).
encoding_rs = "0.8"
# Host-side cryptography and compression for feed scripts.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = "0.10"
getrandom = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "fs"] }
thiserror = "2"
tokio-stream = "0.1"
async-stream = "0.3"
# SQLite storage. `bundled` compiles a vendored SQLite into the binary so the
# flake build stays self-contained (no system libsqlite3 needed).
# tokio-rusqlite re-exports rusqlite — always use the re-export so the
# versions can never skew.
tokio-rusqlite = { version = "0.8", features = ["bundled"] }
scraper = { version = "0.29", features = ["atomic"] }
ego-tree = "0.11"
tracing = "0.1"
ferrous-opencc = { version = "0.4", features = [
    "s2t-conversion",
    "t2s-conversion",
] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["full"] }
