[package]
name = "langhuan"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[lints.clippy]
wildcard_imports = "deny"

[dependencies]
mlua = { version = "0.12", features = [
    "lua54",
    "vendored",
    "async",
    "send",
    "serde",
    "macros",
] }
reqwest = { version = "0.13", features = [
    "query",
    "gzip",
    "deflate",
    "brotli",
] }
# TLS: rustls configured with the bundled Mozilla root set — see
# `http::new_client` for why the platform verifier is not used.
rustls = "0.23"
webpki-roots = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "fs"] }
thiserror = "2"
tokio-stream = "0.1"
async-stream = "0.3"
scraper = { version = "0.29", features = ["atomic"] }
ego-tree = "0.11"
tracing = "0.1"
ferrous-opencc = { version = "0.4", features = [
    "s2t-conversion",
    "t2s-conversion",
] }

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["full"] }
